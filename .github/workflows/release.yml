name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name Quillbar quillbar.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Quillbar.exe
            quillbar.py
            Start Quillbar.bat
          generate_release_notes: true
